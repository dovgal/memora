[package]
name = "memora-api"
version = "0.1.0"
edition = "2024"
default-run = "memora-api"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.49.0", features = ["full"] }
typeshare = "1.0.5"
dotenvy = "0.15.7"
jsonwebtoken = "9.3.0"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1.0.138"
async-stream = "0.3.6"
futures = "0.3.32"
governor = "0.10.4"
bytes = "1.11.1"
dashmap = "6.1.0"
tower-http = { version = "0.7.0", features = ["cors"] }
bcrypt = "0.19.2"
fsrs = "6.6.1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
base64 = "0.22"
sha2 = "0.11"

# Примечание: серверная проверка произношения (whisper.cpp) вынесена из Rust-сборки,
# т.к. зависимости whisper-rs/symphonia раздували образ (>1 ГБ) и ломали билд на Railway.
# Произношение работает через браузерный Web Speech API. При необходимости серверный STT
# подключается отдельным сервисом faster-whisper (Python) по HTTP — без утяжеления Rust.

