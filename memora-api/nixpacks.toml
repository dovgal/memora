# Переменные ЭТАПА СБОРКИ. Railway читает их через Nixpacks — в railway.json
# такого раздела нет вовсе, и прежняя попытка задать SQLX_OFFLINE там молча
# ничего не делала.
#
# Зачем это нужно: в коде есть макросы `sqlx::query!`, которые проверяют SQL
# во время компиляции, подключаясь к базе по DATABASE_URL. Пока DATABASE_URL
# указывал на публичный прокси, сборка втихую зависела от боевой базы,
# доступной из интернета. Стоило перевести подключение на внутреннюю сеть —
# сборка развалилась с 30 ошибками: из сборочного контейнера
# postgres.railway.internal не резолвится.
#
# SQLX_OFFLINE заставляет макросы брать метаданные запросов из каталога .sqlx,
# который лежит в репозитории. База на сборке не нужна вообще.
[variables]
SQLX_OFFLINE = "true"
