# Автообновление зависимостей + алерты по уязвимостям.
# Раз в неделю, minor/patch сгруппированы в один PR (меньше шума),
# major — отдельными PR (требуют внимания). Лимиты скромные — семейный проект.
version: 2
updates:
  # GitHub Actions (версии в .github/workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Фронтенд (npm).
  - package-ecosystem: "npm"
    directory: "/memora-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (нативный компилятор) не поддерживается Next.js 16.2:
      # чистый tsc проходит, но Next не резолвит tsconfig-алиасы @/* через TS-7 API,
      # и сборка падает (см. закрытый PR #12). Остаёмся на 5.x до поддержки TS 7 в Next;
      # 5.x minor/patch продолжают прилетать. Убрать эту строку, когда Next добавит TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Бэкенд (Cargo).
  - package-ecosystem: "cargo"
    directory: "/memora-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: ["minor", "patch"]

  # CAS-микросервис (pip).
  - package-ecosystem: "pip"
    directory: "/memora-math"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
