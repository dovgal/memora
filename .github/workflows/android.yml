# Сборка приложения для Onyx Boox.
#
# Собирается здесь, а не на машине разработчика: Android SDK весит гигабайты, а
# так свежий APK появляется сам после каждой правки. Заодно это проверка кода —
# на устройстве его проверить нечем, но хотя бы компиляция под контролем.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'memora-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Обёртки gradlew в проекте нет намеренно: она тянет двоичный jar, а здесь
      # Gradle ставится нужной версии и без него.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: memora-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: memora-boox-apk
          path: memora-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
