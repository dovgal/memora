name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SQLX_OFFLINE гарантирует, что sqlx использует закоммиченный кэш .sqlx
# и не пытается подключиться к БД во время компиляции (как и сборка на Railway).
env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Кэш сборки Rust: на повторных запусках не пересобирает все зависимости.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: memora-api

      # Кэш бинарника typeshare-cli, чтобы не собирать его каждый раз (~минуты).
      - name: Cache typeshare-cli
        id: cache-typeshare
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-${{ runner.os }}

      - name: Install typeshare-cli
        if: steps.cache-typeshare.outputs.cache-hit != 'true'
        run: cargo install typeshare-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memora-web/package-lock.json

      # --- Бэкенд: главный гейт сборки (ловит ошибки компиляции до Railway) ---
      - name: Check API (cargo check)
        working-directory: ./memora-api
        run: cargo check

      # Clippy — информационно, не блокирует сборку (в проекте могут быть warnings).
      - name: Clippy (non-blocking)
        working-directory: ./memora-api
        continue-on-error: true
        run: cargo clippy --all-targets

      # --- Синхронизация типов Rust -> TypeScript ---
      - name: Generate Types
        run: make types

      # --- Фронтенд ---
      - name: Install web deps
        working-directory: ./memora-web
        run: npm install

      # ESLint — информационно, не блокирует сборку.
      - name: Lint web (non-blocking)
        working-directory: ./memora-web
        continue-on-error: true
        run: npm run lint

      - name: Build Web
        working-directory: ./memora-web
        run: npm run build
