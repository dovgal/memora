name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Verify Typeshare Installation
      run: cargo install typeshare-cli

    - name: Build API
      working-directory: ./memora-api
      run: cargo check
      
    - name: Generate Types
      run: make types
      
    - name: Build Web
      working-directory: ./memora-web
      run: npm install && npm run build
