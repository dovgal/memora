name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# SQLX_OFFLINE гарантирует, что sqlx использует закоммиченный кэш .sqlx
# и не пытается подключиться к БД во время компиляции (как и сборка на Railway).
env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  # Сканер секретов: рабочее дерево (не история — см. .gitleaks.toml).
  # Отдельный быстрый job, идёт параллельно со сборкой.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks (working tree only)
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --redact -c .gitleaks.toml --exit-code 1 -v

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (+ clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Кэш сборки Rust: на повторных запусках не пересобирает все зависимости.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: memora-api

      # Кэш бинарника typeshare-cli, чтобы не собирать его каждый раз (~минуты).
      - name: Cache typeshare-cli
        id: cache-typeshare
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-cli-${{ runner.os }}

      - name: Install typeshare-cli
        if: steps.cache-typeshare.outputs.cache-hit != 'true'
        run: cargo install typeshare-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memora-web/package-lock.json

      # --- Бэкенд: главный гейт сборки (ловит ошибки компиляции до Railway) ---
      - name: Check API (cargo check)
        working-directory: ./memora-api
        run: cargo check

      # Clippy — блокирующий: база вычищена до нуля предупреждений (слайс 19).
      - name: Clippy
        working-directory: ./memora-api
        run: cargo clippy --all-targets -- -D warnings

      # Юнит-тесты бэкенда (llm, subjects, coach, варианты, валидаторы).
      - name: Test API (cargo test)
        working-directory: ./memora-api
        run: cargo test

      # --- Синхронизация типов Rust -> TypeScript ---
      - name: Generate Types
        run: make types

      # --- Фронтенд ---
      - name: Install web deps
        working-directory: ./memora-web
        run: npm install

      # ESLint — блокирующий по ошибкам (ошибки вычищены в слайсе 19; warnings не валят).
      - name: Lint web
        working-directory: ./memora-web
        run: npm run lint

      - name: Build Web
        working-directory: ./memora-web
        run: npm run build
